baseURL: "https://melos7.github.io/yifei-website/" 
title: Yifei Song's Website
theme: PaperMod

# 多语言配置
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

enableInlineShortcodes: true
enableRobotsTXT: true

# 启用搜索功能
outputs:
    home:
        - HTML
        - RSS
        - JSON
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: Papers
          url: papers/
          weight: 2
        - name: Courses
          url: courses/
          weight: 3
        - name: Blog
          url: blog/
          weight: 4
        - name: Search
          url: search/
          weight: 5

languages:
  en:
    languageName: "English"
    weight: 1
    title: "Yifei Song's Website"
    params:
      description: "This website hosts Yifei Song's research papers, course materials, curriculum vitae, blog, and contact information."
    menu:
      main:
        - name: Papers
          url: /papers/
          weight: 2
        - name: Courses
          url: /courses/
          weight: 3
        - name: Blog
          url: /blog/
          weight: 4
        - name: Search
          url: /search/
          weight: 5
  zh:
    languageName: "中文"
    weight: 2
    title: "宋轶飞的个人网站"
    params:
      description: "本网站展示宋轶飞的研究论文、课程材料、简历、博客和联系信息。"
    menu:
      main:
        - name: 论文
          url: /zh/papers/
          weight: 2
        - name: 课程
          url: /zh/courses/
          weight: 3
        - name: 博客
          url: /zh/blog/
          weight: 4
        - name: 搜索
          url: /zh/search/
          weight: 5 


params:
    description: "This website hosts Yifei Song's research papers, course materials, curriculum vitae, blog, and contact information."
    author: Yifei Song
    # googleAnalyticsID: "G-XXXXX"
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["papers","courses","blog"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    
    # 搜索功能配置
    fuseOpts:
        isCaseSensitive: false
        shouldSort: true
        location: 0
        distance: 1000
        threshold: 0.4
        minMatchCharLength: 0
        keys: ["title", "permalink", "summary", "content"]
    profileMode:
          enabled: true
          title: Yifei Song
          subtitle: "I am a PhD student at French National Centre for Scientific Research (CNRS) and Université de Lorraine, under the supervision of <a href=\"https://members.loria.fr/CGardent/\" target=\"_blank\" style=\"text-decoration: underline;\">Claire Gardent</a> (CNRS) and Albert Gatt (Utrecht University).<br><br>I hold a BSc in Computer Science from Sorbonne University and an MSc in Computer Science from EPFL. My research focuses on Natural Language Generation (NLG), with particular interests in reinforcement learning for large language models, multilingual NLP, controllable text generation, alignment, and evaluation."
          imageUrl: "icon.png"
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: Papers
              url: papers/
            - name: Courses
              url: courses/
            - name: Blog
              url: blog/
            # - name: Papers
            #   url: papers/
            # - name: Data
            #   url: data/
            # - name: Books
            #   url: books/
            # - name: Courses
            #   url: courses/
            # - name: Tags
            #   url: tags/
            # - name: Archive
            #   url: archive/
            # - name: Blog
            #   url: https://en.wikipedia.org/wiki/Moritz-Maria_von_Igelfeld_(character)

    socialIcons:
        - name: CV
          url: cv.pdf
        - name: Email
          url: mailto:yifei.song@loria.fr
        # - name: Zoom
        #   url: https://www.zoom.us/my/igelfeld
        - name: Location
          url: location/
        # - name: Office Hours
        #   url: officehours/
        # - name: Google Scholar
        #   url: https://scholar.google.com/citations?user=cL23w-4AAAAJ
        - name: GitHub
          url: https://github.com/MeloS7
        # - name: Substack
        #   url: https://pmichaillat.substack.com
        # - name: YouTube
        #   url: https://www.youtube.com/@pmichaillat
        # - name: Twitter
        #   url: https://x.com/pmichaillat
        # - name: Bluesky
        #   url: https://bsky.app/profile/pmichaillat.bsky.social

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Yifei Song"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2